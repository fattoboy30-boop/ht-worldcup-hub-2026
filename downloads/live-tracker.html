<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 Live Tracker | HT World Cup Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a2e; 
            color: #e0e0e0; 
            min-height: 100vh;
        }
        .header { 
            background: linear-gradient(135deg, #7B2FBE, #00D4AA); 
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { color: white; font-size: 1.8rem; margin-bottom: 10px; }
        .live-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #dc3545;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .date-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .date-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .date-btn:hover, .date-btn.active {
            background: white;
            color: #7B2FBE;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(123, 47, 190, 0.2);
            border-top-color: #7B2FBE;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .error h3 { color: #dc3545; margin-bottom: 10px; }
        .matches-grid {
            display: grid;
            gap: 20px;
        }
        .match-card {
            background: #16162a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(123, 47, 190, 0.3);
        }
        .match-card.live {
            border-color: #dc3545;
            animation: glow 2s infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px rgba(220, 53, 69, 0.3); }
            50% { box-shadow: 0 0 20px rgba(220, 53, 69, 0.5); }
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .match-league {
            font-size: 0.9rem;
            color: #a0a0a0;
        }
        .match-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-live { background: #dc3545; color: white; }
        .status-finished { background: #28a745; color: white; }
        .status-scheduled { background: #6c757d; color: white; }
        .match-teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 25px 20px;
        }
        .team {
            text-align: center;
        }
        .team-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            object-fit: contain;
        }
        .team-name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .match-score {
            text-align: center;
            padding: 0 20px;
        }
        .score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #FFD700;
        }
        .match-time {
            font-size: 0.9rem;
            color: #dc3545;
            margin-top: 5px;
        }
        .match-events {
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
        }
        .event {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .event:last-child { border-bottom: none; }
        .event-icon { font-size: 1.2rem; }
        .event-time { color: #a0a0a0; font-size: 0.85rem; min-width: 40px; }
        .event-desc { flex: 1; }
        .no-matches {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0a0;
        }
        .no-matches h2 { color: #7B2FBE; margin-bottom: 10px; }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border-radius: 12px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 800; color: #FFD700; }
        .stat-label { font-size: 0.8rem; color: #a0a0a0; }
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #7B2FBE;
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(123, 47, 190, 0.4);
            transition: transform 0.3s;
        }
        .refresh-btn:hover { transform: scale(1.1); }
        @media (max-width: 768px) {
            .match-teams { grid-template-columns: 1fr; text-align: center; }
            .match-score { padding: 15px 0; }
            .stats-bar { flex-wrap: wrap; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="live-indicator"></span> FIFA World Cup 2026 Live Tracker</h1>
        <p>Real-time scores, stats, and match events</p>
        <div class="date-selector">
            <button class="date-btn" onclick="changeDate(-1)">← Yesterday</button>
            <button class="date-btn active" onclick="changeDate(0)">Today</button>
            <button class="date-btn" onclick="changeDate(1)">Tomorrow →</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="stat-value" id="totalMatches">0</div>
                <div class="stat-label">Matches</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="liveMatches">0</div>
                <div class="stat-label">Live Now</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalGoals">0</div>
                <div class="stat-label">Goals</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="finishedMatches">0</div>
                <div class="stat-label">Finished</div>
            </div>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading World Cup matches...</p>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadMatches()" title="Refresh">🔄</button>

    <script>
        const API_BASE = "https://soccer.highlightly.net";
        const WORLD_CUP_ID = 1635;
        let currentDate = new Date().toISOString().split("T")[0];
        let apiKey = "";

        // Initialize
        document.addEventListener("DOMContentLoaded", () => {
            loadApiKey();
            loadMatches();
        });

        function loadApiKey() {
            const saved = localStorage.getItem("highlightly_api_key");
            if (saved) {
                apiKey = saved;
            } else {
                // Prompt for API key
                const key = prompt("Enter your Highlightly API Key (get free at highlightly.net/login):");
                if (key) {
                    apiKey = key;
                    localStorage.setItem("highlightly_api_key", key);
                }
            }
        }

        function changeDate(offset) {
            const date = new Date(currentDate);
            date.setDate(date.getDate() + offset);
            currentDate = date.toISOString().split("T")[0];
            
            document.querySelectorAll(".date-btn").forEach((btn, i) => {
                btn.classList.remove("active");
                if (i === 1 && offset === 0) btn.classList.add("active");
                if (i === 0 && offset === -1) btn.classList.add("active");
                if (i === 2 && offset === 1) btn.classList.add("active");
            });
            
            loadMatches();
        }

        async function loadMatches() {
            if (!apiKey) {
                document.getElementById("content").innerHTML = `
                    <div class="error">
                        <h3>⚠️ API Key Required</h3>
                        <p>Please enter your Highlightly API key to view live scores.</p>
                        <p>Get a free key at: <a href="https://highlightly.net/login" target="_blank" style="color: #00D4AA;">highlightly.net/login</a></p>
                        <button onclick="loadApiKey(); loadMatches();" style="margin-top: 15px; padding: 10px 20px; background: #7B2FBE; color: white; border: none; border-radius: 25px; cursor: pointer;">Enter API Key</button>
                    </div>
                `;
                return;
            }

            document.getElementById("content").innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading World Cup matches for ${currentDate}...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_BASE}/matches?leagueId=${WORLD_CUP_ID}&date=${currentDate}&limit=100`, {
                    headers: { "x-rapidapi-key": apiKey }
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                renderMatches(data.data || []);
            } catch (error) {
                document.getElementById("content").innerHTML = `
                    <div class="error">
                        <h3>❌ Error Loading Matches</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px; color: #a0a0a0;">Check your API key or try again later.</p>
                        <button onclick="loadMatches()" style="margin-top: 15px; padding: 10px 20px; background: #7B2FBE; color: white; border: none; border-radius: 25px; cursor: pointer;">Try Again</button>
                    </div>
                `;
            }
        }

        function renderMatches(matches) {
            const container = document.getElementById("content");
            
            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="no-matches">
                        <h2>📅 No Matches Today</h2>
                        <p>World Cup 2026 runs from June 11 to July 19, 2026</p>
                        <p style="margin-top: 15px;">Check back on match days for live scores!</p>
                    </div>
                `;
                updateStats([]);
                return;
            }

            let html = '<div class="matches-grid">';
            
            matches.forEach(match => {
                const isLive = match.status === "inprogress";
                const isFinished = match.status === "finished";
                const statusClass = isLive ? "status-live" : isFinished ? "status-finished" : "status-scheduled";
                const statusText = isLive ? "LIVE" : isFinished ? "FT" : match.time || "TBD";
                
                html += `
                    <div class="match-card ${isLive ? 'live' : ''}">
                        <div class="match-header">
                            <span class="match-league">${match.league?.name || "FIFA World Cup"}</span>
                            <span class="match-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="match-teams">
                            <div class="team">
                                <img src="${match.homeTeam?.logo || ''}" alt="${match.homeTeam?.name || 'Home'}" class="team-logo" onerror="this.style.display='none'">
                                <div class="team-name">${match.homeTeam?.name || "TBD"}</div>
                            </div>
                            <div class="match-score">
                                <div class="score">${match.homeScore ?? "-"} - ${match.awayScore ?? "-"}</div>
                                ${isLive ? `<div class="match-time">${match.elapsed || ""}'</div>` : ''}
                            </div>
                            <div class="team">
                                <img src="${match.awayTeam?.logo || ''}" alt="${match.awayTeam?.name || 'Away'}" class="team-logo" onerror="this.style.display='none'">
                                <div class="team-name">${match.awayTeam?.name || "TBD"}</div>
                            </div>
                        </div>
                        ${match.events ? renderEvents(match.events) : ''}
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
            updateStats(matches);
        }

        function renderEvents(events) {
            if (!events || events.length === 0) return '';
            
            let html = '<div class="match-events">';
            events.forEach(event => {
                let icon = "⚽";
                if (event.type === "yellowcard") icon = "🟨";
                if (event.type === "redcard") icon = "🟥";
                if (event.type === "substitution") icon = "🔄";
                
                html += `
                    <div class="event">
                        <span class="event-icon">${icon}</span>
                        <span class="event-time">${event.time}'</span>
                        <span class="event-desc">${event.player?.name || ''} ${event.team?.name || ''}</span>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        function updateStats(matches) {
            document.getElementById("totalMatches").textContent = matches.length;
            document.getElementById("liveMatches").textContent = matches.filter(m => m.status === "inprogress").length;
            document.getElementById("totalGoals").textContent = matches.reduce((sum, m) => sum + (m.homeScore || 0) + (m.awayScore || 0), 0);
            document.getElementById("finishedMatches").textContent = matches.filter(m => m.status === "finished").length;
        }

        // Auto-refresh every 60 seconds for live matches
        setInterval(() => {
            if (document.querySelector(".match-card.live")) {
                loadMatches();
            }
        }, 60000);
    </script>
</body>
</html>
