<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 - All 48 Team Profile Cards | HT World Cup Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a2e; 
            color: #e0e0e0; 
            padding: 20px;
        }
        .header { 
            text-align: center; 
            padding: 40px 20px; 
            background: linear-gradient(135deg, #7B2FBE, #00D4AA); 
            border-radius: 16px; 
            margin-bottom: 30px;
        }
        .header h1 { color: white; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: rgba(255,255,255,0.9); }
        .print-btn {
            display: inline-block;
            background: #FFD700;
            color: #1a1a2e;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin: 20px 0;
            transition: transform 0.3s;
        }
        .print-btn:hover { transform: scale(1.05); }
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .group-card {
            background: #16162a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .group-header {
            background: linear-gradient(135deg, #7B2FBE, #5A1F8E);
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
        }
        .team-row {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.3s;
        }
        .team-row:hover { background: rgba(123, 47, 190, 0.1); }
        .team-row:last-child { border-bottom: none; }
        .team-flag { font-size: 2.5rem; margin-right: 15px; }
        .team-info { flex: 1; }
        .team-name { font-weight: 600; font-size: 1.1rem; color: white; }
        .team-meta { color: #a0a0a0; font-size: 0.85rem; margin-top: 4px; }
        .team-badge {
            background: #00D4AA;
            color: #1a1a2e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        @media print {
            body { background: white; color: black; }
            .print-btn { display: none; }
            .group-card { break-inside: avoid; border: 1px solid #ccc; }
            .group-header { background: #7B2FBE !important; -webkit-print-color-adjust: exact; }
            .team-row:hover { background: none; }
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5rem; }
            .groups-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

        function renderGroups() {
            const grid = document.getElementById('groupsGrid');
            
            for (const [groupName, teams] of Object.entries(groups)) {
                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';
                
                let teamsHTML = teams.map(team => `
                    <div class="team-row">
                        <span class="team-flag">${team.flag}</span>
                        <div class="team-info">
                            <div class="team-name">${team.name}</div>
                            <div class="team-meta">${team.conf} | FIFA #${team.fifa} | ⭐ ${team.star}</div>
                        </div>
                        <span class="team-badge">#${team.fifa}</span>
                    </div>
                `).join('');
                
                groupCard.innerHTML = `
                    <div class="group-header">Group ${groupName}</div>
                    ${teamsHTML}
                `;
                
                grid.appendChild(groupCard);
            }
        }
        
        renderGroups();
    </script>
</body>
